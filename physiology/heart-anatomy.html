<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Anatomy</title>
    <link rel="stylesheet" href="anatomy-style.css">
</head>
<body>

    <h2 class = "title">heart anatomy</h2>
    <div class="image-container">
        <image src="../images/heart_anatomy.jpg" class="anatomy-image" style="margin-top: 120px;"></image>
        <div class="button-container">
            <button type = "button" style = "position: absolute; top: -1%; left: 17.5%;">superior vena cava</button>
            <button type = "button" style = "position: absolute; top: 9%; right: 71%;">(r) pulmonary artery</button>
            <button type = "button" style = "position: absolute; top: 34%; right: 71%;">right atrium</button>
            <button type = "button" style = "position: absolute; top: 43.5%; right: 71%;">tricuspid valve</button>
            <button type = "button" style = "position: absolute; top: 52%; right: 67.5%;">right ventricle</button>
            <button type = "button" style = "position: absolute; top: 69%; right: 66.5%;">inferior vena cava</button>
            <button type = "button" style = "position: absolute; top: 2%; left: 60%;">aorta</button>
            <button type = "button" style = "position: absolute; top: 11%; left: 62.5%;">pulmonary artery</button>
            <button type = "button" style = "position: absolute; top: 23%; left: 75%;">(l) pulmonary artery</button>
            <button type = "button" style = "position: absolute; top: 33%; left: 67.5%;">pulmonary valve</button>
            <button type = "button" style = "position: absolute; top: 41%; left: 67.5%;">mitral valve</button>
            <button type = "button" style = "position: absolute; top: 51%; left: 69.5%;">aortic valve</button>
            <button type = "button" style = "position: absolute; top: 62%; left: 72%;">left ventricle</button>
            <button type = "button" style = "position: absolute; top: 80%; left: 69.5%;">apex</button>
            <button type = "button" style = "position: absolute; top: 88%; left: 65.5%;">systemic artery</button>
           
        </div>
    </div>
    
</body>
</html>
