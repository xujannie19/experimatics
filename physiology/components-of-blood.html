<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Components of Blood</title>
    <link rel="stylesheet" href="anatomy-style.css">
</head>
<body class="page">
    
    
    <h2 class = "title">components of blood</h2>
    <div class="image-container">
        <image src="../images/comps_blood.png" class="anatomy-image" style="margin-top: 150px;"></image>
        <div class="button-container">
            <button type = "button" style = "position: absolute; top: -19%; left: 18%;">
                <b>red blood cells/RBC</b><br>
                <small>(45% of blood, bi-concave disc;<br>
                    no nucleus or mitochondria;<br>
                    carries hemoglobin, O2, CO2, etc;<br>
                    recycled every 4 months by liver and spleen)
                </small>
            </button>
            <button type = "button" style = "position: absolute; top: -12%; left: 55%;">
                <b>plasma</b><br>
                <small>(55% of blood, yellow + sticky fluid;<br>
                    mainly water and proteins;<br>
                    carries heat energy, glucose,<br>
                    amino acids, vitamins, etc;<br>
                    provides some immune defense)
                </small>
            </button>
           <button type = "button" style = "position: absolute; top: 72%; left: 10%;">
                <b>platelets</b><br>
                <small>(&lt;1% of blood; stops bleeding through<br>
                    <b>hemostasis</b>, 
                    using prothrombin, thrombin,<br>
                    and fibrin to form clots;<br>
                    can cause undesired blood clots)
                </small>
            </button>
            <button type = "button" style = "position: absolute; top: 83%; left: 44%;">
                <b>white blood cells/WBC</b><br>
                <small>(&lt;1% of blood; mainly phagocytes or lymphocytes;<br>
                    feeds on pathogens via 
                    <b>phagocytosis</b> and/or antibody production)
                </small>
            </button>
            
        </div>
    </div>
    
</body>
</html>
