<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nephron Anatomy</title>
    <link rel="stylesheet" href="anatomy-style.css">
</head>
<body class="page">
    <h2 class = "title">nephron anatomy</h2>
    
    <div class="image-container">
        
        <image src="../images/nephron_anatomy.png" class="anatomy-image"></image>
        <div class="button-container">
            <button type = "button" style = "position: absolute; top: 8%; right: 76%;">efferent arteriole</button>

            <button type = "button" style = "position: absolute; top: 5%; right: 37%;">glomerular (Bowman's) capsule</button>
            <button type = "button" style = "position: absolute; top: 5%; left: 69%;">distal convoluted tubule</button>
            <button type = "button" style = "position: absolute; top: 46%; left: 75.8%;">collecting duct</button>
            
        </div>
    </div>
